<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Оплата квитка</title>
    <link rel="stylesheet" href="oplata.css">
</head>
<body>
    <div class="payment-container">
        <h2>Оформлення оплати</h2>
        <form id="payment-form">
            <div class="input-group">
                <label>Номер картки</label>
                <input type="text" placeholder="0000 0000 0000 0000" required>
            </div>
            <div class="row">
                <div class="input-group">
                    <label>Термін дії</label>
                    <input type="text" placeholder="ММ/РР" required>
                </div>
                <div class="input-group">
                    <label>CVV</label>
                    <input type="password" placeholder="***" required>
                </div>
            </div>
            <button type="submit" class="pay-btn">Оплатити</button>
        </form>
    </div>
    <script src="oplata.js"></script>
</body>
</html>
